<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="할 일과 마감일을 정리하는 개인 업무 목록">
<title>오늘의 업무</title>
<style>
:root{font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;color:#162c28;background:#edf3ef;color-scheme:light}
*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:clamp(24px,6vw,68px) 18px}
header{background:#124638;color:#fff;padding:clamp(24px,6vw,44px);border-radius:24px;margin-bottom:20px}
header p{color:#c8e8da;margin:0 0 12px}h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.07em;margin:0 0 24px}
.stats{display:flex;flex-wrap:wrap;gap:12px 24px;margin-bottom:12px;font-size:.95rem}progress{width:100%;height:10px;display:block;accent-color:#81d5ac}
section{background:white;border:1px solid #dbe6df;border-radius:20px;padding:clamp(16px,4vw,28px);margin-bottom:14px}
h2{font-size:1.2rem;margin:0 0 14px}form{display:grid;grid-template-columns:minmax(0,1fr) minmax(144px,auto) auto;gap:10px;align-items:end}
label{display:grid;gap:6px;font-size:.9rem}button,input{font:inherit;border-radius:10px;min-height:44px}input{width:100%;border:1px solid #a9bdb3;padding:9px;color:inherit}
button{border:1px solid #c8dad0;background:white;color:#124638;padding:8px 12px;cursor:pointer}button:hover{background:#edf6ef}button:focus-visible,input:focus-visible{outline:3px solid #387c65;outline-offset:2px}
.primary,[aria-pressed=true]{background:#145541;color:white;border-color:#145541}.primary:hover,[aria-pressed=true]:hover{background:#0e4434}
nav,.actions{display:flex;gap:6px;flex-wrap:wrap}ul{list-style:none;padding:0;margin:14px 0 0}li{display:flex;align-items:center;gap:12px;border-top:1px solid #e3ebe5;padding:12px 0}
.check{width:22px;min-height:22px;height:22px;accent-color:#145541;flex:none}.task{flex:1;min-width:0;overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:#526961}
small{display:block;color:#50665f;margin-top:4px}.late{color:#aa321d}.empty,footer{color:#50665f;text-align:center;padding:12px}.danger{color:#a53024}
#cancel[hidden]{display:none}#feedback{color:#a53024;margin-bottom:0}#feedback:empty{display:none}
@media(max-width:550px){form{grid-template-columns:minmax(0,1fr) auto}form label:first-child{grid-column:1/-1}.actions button{padding:7px;font-size:.875rem}}
</style>
<main>
<header><p id="today"></p><h1>오늘의 업무</h1><div class="stats" aria-live="polite"><span id="total"></span><span id="open"></span><span id="done"></span></div><progress id="progress" aria-label="업무 완료율" max="1" value="0"></progress></header>
<section>
<h2 id="form-title">새 업무</h2>
<form id="editor">
<label>업무 이름<input id="name" maxlength="120" required placeholder="예: 주간 보고서 작성"></label>
<label>마감일<input type="date" id="due"></label>
<div class="actions"><button class="primary" id="submit">추가</button><button type="button" id="cancel" hidden>취소</button></div>
</form><p id="feedback" role="alert"></p>
</section>
<section><h2>업무 목록</h2><nav aria-label="업무 상태 필터"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="open" aria-pressed="false">미완료</button><button data-filter="done" aria-pressed="false">완료</button></nav><ul id="tasks"></ul><p class="empty" id="empty"></p></section>
<footer>업무 목록은 이 브라우저에 저장됩니다.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const key = 'today-work-tasks-v1';
let tasks = [];
let filter = 'all';
let editing = null;
try {
  const saved = JSON.parse(localStorage.getItem(key) || '[]');
  if (Array.isArray(saved)) tasks = saved;
} catch {
  $('feedback').textContent = '저장된 업무를 불러오지 못했습니다.';
}
const now = new Date();
const localDay = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('-');
const dateFormat = new Intl.DateTimeFormat('ko-KR', {dateStyle:'long'});
$('today').textContent = new Intl.DateTimeFormat('ko-KR', {month:'long',day:'numeric',weekday:'long'}).format(now);
function commit(next) {
  try {
    localStorage.setItem(key, JSON.stringify(next));
    $('feedback').textContent = '';
  } catch {
    $('feedback').textContent = '브라우저에 저장하지 못했습니다. 이번 화면에서만 변경 내용이 유지됩니다.';
  }
  tasks = next;
  render();
}
function resetEditor() {
  editing = null;
  $('editor').reset();
  $('form-title').textContent = '새 업무';
  $('submit').textContent = '추가';
  $('cancel').hidden = true;
}
function action(label, task, callback) {
  const button = document.createElement('button');
  button.textContent = label;
  button.setAttribute('aria-label', task.name + ' ' + label);
  button.onclick = callback;
  return button;
}
function render() {
  const done = tasks.filter(task => task.done).length;
  $('total').textContent = '전체 ' + tasks.length;
  $('open').textContent = '미완료 ' + (tasks.length - done);
  $('done').textContent = '완료 ' + done;
  $('progress').max = tasks.length || 1;
  $('progress').value = done;
  const visible = tasks.filter(task => filter === 'all' || task.done === (filter === 'done'));
  $('tasks').replaceChildren();
  $('empty').hidden = visible.length > 0;
  $('empty').textContent = tasks.length ? '이 상태의 업무가 없습니다.' : '새 업무를 추가해 보세요.';
  for (const task of visible) {
    const row = document.createElement('li');
    row.classList.toggle('done', task.done);
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'check';
    checkbox.checked = task.done;
    checkbox.setAttribute('aria-label', task.name + ' 완료');
    checkbox.onchange = () => {
      commit(tasks.map(item => item.id === task.id ? {...item, done: checkbox.checked} : item));
      const index = visible.indexOf(task);
      const nextIndex = filter === 'all' ? index : Math.min(index, $('tasks').children.length - 1);
      ($('tasks').children[nextIndex]?.querySelector('.check') || document.querySelector('[aria-pressed=true]')).focus();
    };
    const body = document.createElement('div');
    body.className = 'task';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = task.name;
    body.append(title);
    if (task.due) {
      const date = document.createElement('small');
      const late = !task.done && task.due < localDay;
      date.classList.toggle('late', late);
      date.textContent = (late ? '기한 지남 · ' : '') + dateFormat.format(new Date(task.due + 'T00:00:00'));
      body.append(date);
    }
    const actions = document.createElement('div');
    actions.className = 'actions';
    const edit = action('수정', task, () => {
      editing = task.id;
      $('name').value = task.name;
      $('due').value = task.due;
      $('form-title').textContent = '업무 수정';
      $('submit').textContent = '저장';
      $('cancel').hidden = false;
      $('name').focus();
    });
    const remove = action('삭제', task, () => {
      if (!confirm('이 업무를 삭제할까요?')) return;
      if (editing === task.id) resetEditor();
      commit(tasks.filter(item => item.id !== task.id));
      (document.querySelector('[aria-pressed=true]')).focus();
    });
    remove.className = 'danger';
    actions.append(edit, remove);
    row.append(checkbox, body, actions);
    $('tasks').append(row);
  }
}
$('name').oninput = () => $('name').setCustomValidity('');
$('editor').onsubmit = event => {
  event.preventDefault();
  const name = $('name').value.trim();
  if (!name) {
    $('name').setCustomValidity('업무 이름을 입력하세요.');
    $('name').reportValidity();
    return;
  }
  const due = $('due').value;
  if (editing) {
    commit(tasks.map(task => task.id === editing ? {...task, name, due} : task));
  } else {
    if (filter === 'done') selectFilter(document.querySelector('[data-filter=open]'));
    commit([{id: crypto.randomUUID(), name, due, done:false}, ...tasks]);
  }
  resetEditor();
  $('name').focus();
};
$('cancel').onclick = () => { resetEditor(); $('name').focus(); };
function selectFilter(button) {
  filter = button.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
}
document.querySelectorAll('[data-filter]').forEach(button => {
  button.onclick = () => { selectFilter(button); render(); };
});
render();
</script>
</html>
